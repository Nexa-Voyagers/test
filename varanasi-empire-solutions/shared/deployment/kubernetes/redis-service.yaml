---
# Redis Service
# Exposes Redis cache cluster for internal connections
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: varanasi-empire
  labels:
    app: varanasi-empire
    component: cache
    version: "7"
  annotations:
    description: "Redis Service for Varanasi Empire"
    prometheus.io/scrape: "true"
    prometheus.io/port: "6379"
spec:
  type: ClusterIP
  selector:
    app: varanasi-empire
    component: cache
  ports:
  - name: redis
    port: 6379
    targetPort: 6379
    protocol: TCP
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800

---
# Headless Service for Redis StatefulSet
# For direct pod access in cluster
apiVersion: v1
kind: Service
metadata:
  name: redis-headless
  namespace: varanasi-empire
  labels:
    app: varanasi-empire
    component: cache
  annotations:
    description: "Headless service for Redis StatefulSet"
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: varanasi-empire
    component: cache
  ports:
  - name: redis
    port: 6379
    targetPort: 6379
    protocol: TCP
  publishNotReadyAddresses: true

---
# Service for Redis Exporter (Prometheus metrics)
apiVersion: v1
kind: Service
metadata:
  name: redis-exporter-service
  namespace: varanasi-empire
  labels:
    app: varanasi-empire
    component: cache
    monitoring: "true"
  annotations:
    description: "Redis Exporter Service for Prometheus"
    prometheus.io/scrape: "true"
    prometheus.io/port: "9121"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  selector:
    app: varanasi-empire
    component: cache
  ports:
  - name: metrics
    port: 9121
    targetPort: 9121
    protocol: TCP

---
# External NodePort Service for monitoring (optional)
apiVersion: v1
kind: Service
metadata:
  name: redis-nodeport-service
  namespace: varanasi-empire
  labels:
    app: varanasi-empire
    component: cache
    access: external
  annotations:
    description: "Redis NodePort Service for external access"
spec:
  type: NodePort
  selector:
    app: varanasi-empire
    component: cache
  ports:
  - name: redis
    port: 6379
    targetPort: 6379
    protocol: TCP
    nodePort: 30379  # Change if conflicts
