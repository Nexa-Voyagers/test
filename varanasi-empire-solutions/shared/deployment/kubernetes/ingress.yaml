---
# Certificate for Let's Encrypt (requires cert-manager)
# Automatic SSL certificate provisioning and renewal
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: varanasi-empire-cert
  namespace: varanasi-empire
  labels:
    app: varanasi-empire
    component: tls
spec:
  secretName: tls-secret
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
  - varanasi-empire.example.com
  - www.varanasi-empire.example.com
  - api.varanasi-empire.example.com
  duration: 2160h  # 90 days
  renewBefore: 720h  # 30 days

---
# ClusterIssuer for Let's Encrypt (requires cert-manager)
# Production certificates
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
  labels:
    app: varanasi-empire
    component: tls
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@varanasi-empire.example.com
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
    - http01:
        ingress:
          class: nginx
    - dns01:
        route53:
          region: us-west-2
          hostedZoneID: Z1234567890ABC

---
# ClusterIssuer for Let's Encrypt Staging (for testing)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
  labels:
    app: varanasi-empire
    component: tls
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: admin@varanasi-empire.example.com
    privateKeySecretRef:
      name: letsencrypt-staging
    solvers:
    - http01:
        ingress:
          class: nginx

---
# NetworkPolicy for Ingress
# Control traffic to Ingress controller
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: varanasi-empire-ingress-policy
  namespace: varanasi-empire
spec:
  podSelector:
    matchLabels:
      app: varanasi-empire
  policyTypes:
  - Ingress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 3000
    - protocol: TCP
      port: 8080
  - from:
    - podSelector:
        matchLabels:
          app: varanasi-empire
    ports:
    - protocol: TCP
      port: 3000
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 8443

---
# Ingress backend configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: ingress-nginx
data:
  enable-modsecurity: "true"
  enable-owasp-core-rules: "true"
  client-max-body-size: "100m"
  client-body-timeout: "600"
  client-header-timeout: "600"
  proxy-connect-timeout: "600"
  proxy-send-timeout: "600"
  proxy-read-timeout: "600"
  upstream-keepalive-connections: "32"
  upstream-keepalive-requests: "100"
  upstream-keepalive-timeout: "60"
