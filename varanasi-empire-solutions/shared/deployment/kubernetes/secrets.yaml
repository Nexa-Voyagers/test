metadata:
  name: tls-secret
  namespace: varanasi-empire
  labels:
    app: varanasi-empire
    component: tls
  annotations:
    description: "TLS/SSL certificates for HTTPS"
type: kubernetes.io/tls
data:
  # Base64-encoded certificate and key
  # tls.crt: base64-encoded certificate
  # tls.key: base64-encoded private key
  tls.crt: ""
  tls.key: ""

